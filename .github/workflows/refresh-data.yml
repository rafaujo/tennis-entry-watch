name: Refresh tracked tennis data

on:
  schedule:
    - cron: "17 10,16,22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-tracked-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Collect ranking and schedules
        run: python -m tennis_entry_watch.collectors.live_tennis_cli
      - name: Validate and rebuild
        run: |
          pytest
          python -m tennis_entry_watch.site.build
      - name: Detect changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Update automation branch
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REFRESH_BRANCH: automation/refresh-tennis-data
        shell: bash
        run: |
          git config user.name "tennis-entry-watch[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$REFRESH_BRANCH"
          git add data/rankings/atp-live-current.json site
          git commit -m "Atualiza ranking e schedules"
          git push --force origin "$REFRESH_BRANCH"

          if gh pr view "$REFRESH_BRANCH" --json url --jq .url >/dev/null 2>&1; then
            gh pr edit "$REFRESH_BRANCH" \
              --title "Atualização automática de ranking e schedules" \
              --body "Atualização supervisionada gerada pelo workflow agendado. Os dados foram coletados, validados, testados e o site foi reconstruído. Revise as mudanças antes do merge."
          else
            gh pr create \
              --base main \
              --head "$REFRESH_BRANCH" \
              --title "Atualização automática de ranking e schedules" \
              --body "Atualização supervisionada gerada pelo workflow agendado. Os dados foram coletados, validados, testados e o site foi reconstruído. Revise as mudanças antes do merge."
          fi
