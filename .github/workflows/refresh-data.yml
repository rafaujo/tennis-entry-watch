name: Refresh tracked tennis data

on:
  schedule:
    - cron: "17 10,16,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-tracked-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Run test suite
        run: pytest
      - name: Collect ranking and schedules
        run: python -m tennis_entry_watch.collectors.live_tennis_cli
      - name: Collect tournament catalog
        run: python -m tennis_entry_watch.collectors.tournament_catalog_cli
      - name: Retain last non-empty entry lists
        run: python -m tennis_entry_watch.collectors.entry_snapshot_cli
      - name: Backfill published draws
        run: python -m tennis_entry_watch.collectors.published_draw_cli
      - name: Validate real data quality
        run: python -m tennis_entry_watch.quality
      - name: Rebuild site
        run: python -m tennis_entry_watch.site.build
      - name: Detect changes
        id: changes
        shell: bash
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish validated refresh to main
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "tennis-entry-watch[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rankings/atp-live-current.json data/tournaments/catalog.json data/entry-snapshots site
          git commit -m "Atualiza ranking, schedules e torneios"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
